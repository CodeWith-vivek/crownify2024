name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Builds the client + SSR bundles the e2e server needs — the 4 SSR
      # routes and the critical-path spec both navigate real pages, not
      # just hit the API.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
